<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><title>Command Center v4</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css"></head><body><div class="app"><aside class="sidebar"><div class="brand">◈ Command <span>Center</span></div><div class="side-caption">PERSONAL OPERATING SYSTEM</div><nav id="nav" aria-label="Main navigation"><button data-view="dashboard" class="navbtn active">⌂ <span>Dashboard</span></button><button data-view="tasks" class="navbtn">☑ <span>My Tasks</span></button><button data-view="routines" class="navbtn">↻ <span>Routines</span></button><button data-view="calendar" class="navbtn">▦ <span>Calendar</span></button><button data-view="history" class="navbtn">◷ <span>History</span></button><button data-view="settings" class="navbtn">⚙ <span>Settings</span></button></nav><div class="side-foot">Local-first · Free hosting<br><span id="storageStatus">Saved on this device</span></div></aside><div class="workspace"><header class="topbar"><div><div class="eyebrow" id="sectionLabel">YOUR WORKSPACE</div><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><div class="profile-switch"><label for="profileSelect">Profile</label><select id="profileSelect" aria-label="Switch profile"></select><button class="btn" id="addProfile" type="button" title="Create a local profile">+ Profile</button></div><button class="btn" id="themeToggle" title="Switch theme">☀ Light</button><button class="btn primary" id="quickAdd">+ New task</button></div></header><main id="content" tabindex="-1"></main></div></div><nav class="mobile-nav" aria-label="Mobile navigation"><button data-view="dashboard">⌂<span>Home</span></button><button data-view="tasks">☑<span>Tasks</span></button><button data-view="routines">↻<span>Routines</span></button><button data-view="calendar">▦<span>Calendar</span></button><button data-view="history">◷<span>History</span></button><button data-view="settings">⚙<span>Settings</span></button></nav><dialog id="editor"><form id="editorForm"><h2 id="editorTitle">Edit task</h2><input type="hidden" id="editId"><input type="hidden" id="editContext"><label for="editName">Task name</label><input id="editName" class="input" maxlength="160" required><div class="formgrid"><div><label for="editPriority">Priority</label><select id="editPriority"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></div><div><label for="editDue">Due date (individual tasks)</label><input type="date" id="editDue"></div><div><label for="editTime">Due time</label><input type="time" id="editTime"></div><div><label for="editRepeat">Repeat</label><select id="editRepeat"><option value="none">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="weekdays">Weekdays (Mon–Fri)</option><option value="after">After completion (N days)</option></select></div></div><label for="editRepeatDays">Days after completion (for after-completion recurrence)</label><input id="editRepeatDays" class="input" type="number" min="1" max="365" value="1"><label for="editDepends">Depends on individual task</label><select id="editDepends"></select><label for="editReminder">Reminder</label><select id="editReminder"><option value="none">None</option><option value="at">At due time (in-app)</option><option value="15">15 minutes before (in-app)</option><option value="60">1 hour before (in-app)</option></select><label for="editSubtasks">Subtasks — one per line</label><textarea id="editSubtasks" rows="4" placeholder="First step&#10;Second step"></textarea><div class="actions"><button class="btn" type="button" id="cancelEdit">Cancel</button><button class="btn primary" type="submit">Save task</button></div></form></dialog><dialog id="routineEditor"><form id="routineForm"><h2 id="routineTitle">New routine</h2><input type="hidden" id="routineId"><label for="routineName">Routine name</label><input class="input" id="routineName" required maxlength="80"><label for="routineEmoji">Icon</label><input class="input" id="routineEmoji" maxlength="8" value="📋"><label for="routineAliases">Command aliases (comma-separated)</label><input class="input" id="routineAliases" placeholder="work, office, commute"><label for="routineTasks">Template tasks — one per line; ! = high priority, ~ = low</label><textarea id="routineTasks" rows="7"></textarea><div class="actions"><button type="button" class="btn danger" id="deleteRoutine">Delete</button><button type="button" class="btn" id="cancelRoutine">Cancel</button><button type="submit" class="btn primary">Save routine</button></div></form></dialog><input type="file" id="importFile" accept="application/json" hidden><div class="toast" id="toast" role="status"></div><script src="app.js" defer></script></body></html>
